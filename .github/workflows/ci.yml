name: CI

# Ramuri:
#   release/stage – tot ce este gata de testat; aici se adună modificările
#   release/prod  – doar ce a fost lansat; primește modificări numai din release/stage
on:
  push:
    branches: [release/stage, release/prod]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Pe ramurile de lansare o rulare nu este întreruptă de următoarea: ar putea fi în plin deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, teste și build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Aceeași versiune majoră ca pe server.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alconst
          POSTGRES_PASSWORD: alconst
          POSTGRES_DB: alconst_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alconst -d alconst_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CHECKPOINT_DISABLE: 1
      TEST_DATABASE_URL: postgresql://alconst:alconst@127.0.0.1:5432/alconst_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalează dependențele
        run: pnpm install --frozen-lockfile

      - name: Compilează pachetele comune
        run: pnpm build:packages

      - name: Verifică formatarea
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Teste unitare
        run: pnpm test

      - name: Teste e2e (API și worker)
        run: pnpm test:e2e

      # Termenele sunt date calendaristice: rezultatele nu au voie să depindă de fusul orar al
      # serverului. Suita rulează a doua oară cu fusul orar al firmei.
      - name: Teste în fusul orar al României
        run: pnpm test && pnpm test:e2e
        env:
          TZ: Europe/Bucharest

      - name: Build
        run: pnpm build

  # Instalarea pe serverul de stage, după ce toate verificările au trecut.
  #
  # Rămâne oprită până când infrastructura este configurată: variabila de repository
  # DEPLOY_STAGE_ENABLED trebuie să fie `true`. Valorile (rol, instanță, document SSM, adresă) stau
  # în secretele și variabilele mediului GitHub „stage”, nu în repository. Vezi docs/deploy.md.
  deploy-stage:
    name: Deploy pe stage
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/stage' && vars.DEPLOY_STAGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: stage
    concurrency:
      group: deploy-stage
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Autentificare în AWS (OIDC, fără chei stocate)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: alconst-deploy-stage

      - name: Pornește deploy-ul pe server
        id: send
        env:
          INSTANCE_ID: ${{ secrets.DEPLOY_INSTANCE_ID }}
          DOCUMENT_NAME: ${{ vars.SSM_DOCUMENT_NAME }}
        run: |
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$DOCUMENT_NAME" \
            --parameters "environment=stage,commit=$GITHUB_SHA" \
            --comment "Deploy stage $GITHUB_SHA" \
            --query 'Command.CommandId' --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Așteaptă rezultatul
        env:
          INSTANCE_ID: ${{ secrets.DEPLOY_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          status=InProgress
          for _ in $(seq 1 180); do
            status="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2> /dev/null || echo Pending)"
            case "$status" in Pending | InProgress | Delayed) sleep 10 ;; *) break ;; esac
          done
          echo "Stare: $status"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text | tail -n 60
          if [ "$status" != "Success" ]; then
            echo "--- erori ---"
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' --output text | tail -n 60
            exit 1
          fi

      # Confirmarea se face din afară, pe adresa publică: versiunea nouă este cea care răspunde,
      # cu baza de date și Redis disponibile (/api/ready, nu /api/health).
      - name: Verifică versiunea publicată
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for _ in $(seq 1 15); do
            body="$(curl -fsS --max-time 10 "$APP_URL/api/ready" || true)"
            if printf '%s' "$body" | grep -q "\"version\":\"$GITHUB_SHA\""; then
              echo "Publicat: $body"
              exit 0
            fi
            sleep 4
          done
          echo "Adresa publică nu răspunde cu versiunea $GITHUB_SHA: $body"
          exit 1
